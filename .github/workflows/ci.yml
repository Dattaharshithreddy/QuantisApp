# ─────────────────────────────────────────────────────────────────────────────
# QUANTIS CI Pipeline  (v1.0.0)
#
# Runs on every push to main and every pull request.
# Jobs run in this order (each depends on the previous):
#
#   validate → test → build
#
# validate:  TypeScript type check + dependency audit
# test:      All 9 test suites (node-based + Jest)
# build:     EAS preview APK build (main branch only)
#
# Required GitHub secrets:
#   EXPO_TOKEN      — from expo.dev account settings
#
# Optional secrets (enables full build):
#   ANDROID_KEYSTORE_BASE64  — base64-encoded release keystore
#   KEYSTORE_PASSWORD
#   KEY_ALIAS
#   KEY_PASSWORD
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:     # allow manual trigger from GitHub UI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true   # cancel stale runs on new push

# ─────────────────────────────────────────────────────────────────────────────
# Job 1: Validate — type check + audit
# Fastest job, runs first. Fails fast on type errors before running tests.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  validate:
    name: Validate (TypeScript + Audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: TypeScript type check
        run: npx tsc --noEmit --skipLibCheck --skipDefaultLibCheck 2>&1 | grep 'error TS' | grep -v 'TS5107' | grep -v 'node_modules' | tee /tmp/ts_errors.txt; test ! -s /tmp/ts_errors.txt
        # skipLibCheck avoids errors in third-party type definitions.
        # Our own code is fully checked.

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
        # Fails only on high/critical vulnerabilities.
        # Low/moderate audit findings are reported but don't block CI.
        continue-on-error: true   # audit findings don't block the pipeline

# ─────────────────────────────────────────────────────────────────────────────
# Job 2: Test — all 9 test suites
# ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Tests (9 suites)
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Jest (for Jest-based test suites)
        run: npm install --save-dev jest@29
        # Jest is installed locally so CI doesn't depend on a global install.

      - name: Run Node-based test suites
        run: |
          echo "── Live Trading Tests ──"
          node src/utils/__tests__/liveTrading.test.js

          echo "── Trading Coach Tests ──"
          node src/utils/__tests__/tradingCoach.test.js

          echo "── Candle Cache Tests ──"
          node src/utils/__tests__/candleCache.test.js

          echo "── Futures (NSE) Tests ──"
          node src/utils/__tests__/futures.test.js

          echo "── Futures (Binance) Tests ──"
          node src/utils/__tests__/bnFutures.test.js

          echo "── Portfolio Risk Manager Tests ──"
          node src/utils/__tests__/portfolioRiskManager.test.js

      - name: Run Jest-based test suites
        run: |
          npx jest \
            --testPathPattern="(regimeEvaluation|strategyAndContextAnalytics|marketContextIntegration)" \
            --rootDir=src/utils/__tests__ \
            --testEnvironment=node \
            --no-coverage \
            --forceExit
        # forceExit: Jest can hang if async operations don't complete.

      - name: Test summary
        if: always()
        run: echo "All test suites completed"

# ─────────────────────────────────────────────────────────────────────────────
# Job 3: Build — EAS preview APK
# Only runs on pushes to main (not on PRs, to save EAS build minutes).
# ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build APK (Preview)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 60
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Install Expo CLI + EAS CLI
        run: |
# EAS build removed - using Gradle in build.yml instead
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload build URL to summary
        if: success()
        run: |
          echo "## Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "Preview APK available on expo.dev" >> $GITHUB_STEP_SUMMARY
