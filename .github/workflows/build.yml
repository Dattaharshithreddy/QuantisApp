name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TYPESCRIPT_SETUP: 1

      - name: Patch AGP 8 compatibility
        run: |
          echo "=== Patching components.release → components.getByName('release') ==="

          # 1. expo-modules-core (known issue)
          FILE="node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle"
          if [ -f "$FILE" ]; then
            sed -i 's/components\.release/components.getByName("release")/g' "$FILE"
            echo "Patched: $FILE"
          fi

          # 2. Patch ALL gradle files under node_modules that reference components.release
          find node_modules -name "*.gradle" | while read f; do
            if grep -q "components\.release" "$f" 2>/dev/null; then
              sed -i 's/components\.release/components.getByName("release")/g' "$f"
              echo "Patched: $f"
            fi
          done

          # 3. Patch expo-local-authentication build.gradle — add compileSdkVersion if missing
          LOCAL_AUTH="node_modules/expo-local-authentication/android/build.gradle"
          if [ -f "$LOCAL_AUTH" ]; then
            # If compileSdkVersion is missing, inject it inside android { } block
            if ! grep -q "compileSdkVersion" "$LOCAL_AUTH"; then
              sed -i '/^android {/a\    compileSdkVersion 34' "$LOCAL_AUTH"
              echo "Added compileSdkVersion 34 to: $LOCAL_AUTH"
            fi
          fi

          # 4. Also patch any other expo packages missing compileSdkVersion
          find node_modules/expo-*/android -name "build.gradle" 2>/dev/null | while read f; do
            if grep -q "^android {" "$f" && ! grep -q "compileSdkVersion\|compileSdk" "$f"; then
              sed -i '/^android {/a\    compileSdkVersion 34' "$f"
              echo "Added compileSdkVersion to: $f"
            fi
          done

          echo "=== All patches applied ==="

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
