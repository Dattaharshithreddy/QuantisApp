name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TYPESCRIPT_SETUP: 1

      - name: Patch expo-modules-core for AGP 8 compatibility
        run: |
          PLUGIN_FILE="node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle"
          if [ -f "$PLUGIN_FILE" ]; then
            sed -i 's/components\.release/components.getByName("release")/g' "$PLUGIN_FILE"
            echo "Patched ExpoModulesCorePlugin.gradle for AGP 8"
          fi

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tail -100
        continue-on-error: true
        id: gradle_build

      - name: Show Gradle failure details
        if: steps.gradle_build.outcome == 'failure'
        run: |
          echo "=== GRADLE BUILD FAILED ==="
          cd android
          ./gradlew assembleRelease --no-daemon --info 2>&1 | grep -E "ERROR|FAILURE|error:|Exception|Could not|Caused by" | tail -50

      - name: Fail if build failed
        if: steps.gradle_build.outcome == 'failure'
        run: exit 1

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
