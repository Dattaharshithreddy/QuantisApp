name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TYPESCRIPT_SETUP: 1

      - name: Patch AGP 8 compatibility
        run: |
          find node_modules -name "*.gradle" -exec grep -l "from components\.release" {} \; | while read f; do
            sed -i 's/from components\.release/def __rc = components.findByName("release"); if (__rc != null) { from __rc }/g' "$f"
            echo "Patched: $f"
          done

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        # No pipe — Gradle exit code preserved, step fails if build fails

      - name: Verify APK exists
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "APK not found at $APK"
            find android/app/build -name "*.apk" 2>/dev/null || echo "No APK files found"
            exit 1
          fi
          echo "APK found: $(du -sh $APK)"

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
