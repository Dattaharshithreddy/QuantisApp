name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TYPESCRIPT_SETUP: 1

      - name: Patch AGP 8 compatibility
        run: |
          echo "=== Patching AGP 8 gradle issues ==="

          # Fix: replace `from components.release` with null-safe version in ALL gradle files.
          # In AGP 8, components.release throws "SoftwareComponent not found" during
          # configuration phase. findByName("release") is safe and returns null if not ready.
          find node_modules -name "*.gradle" | while read f; do
            if grep -q "from components\.release" "$f" 2>/dev/null; then
              python3 -c "
import sys
with open('$f', 'r') as file:
    content = file.read()
old = '          from components.release'
new = '          def rc = components.findByName(\"release\"); if (rc != null) { from rc }'
result = content.replace(old, new)
# also handle 2-space indent variant
old2 = '    from components.release'
new2 = '    def rc = components.findByName(\"release\"); if (rc != null) { from rc }'
result = result.replace(old2, new2)
with open('$f', 'w') as file:
    file.write(result)
print('Patched: $f')
"
            fi
          done

          echo "=== Patches complete ==="

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
