name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TYPESCRIPT_SETUP: 1

      - name: Patch expo-modules-core for AGP 8 compatibility
        run: |
          # Fix: ExpoModulesCorePlugin.gradle uses components.release which
          # doesn't exist in AGP 8.x — patch it to use components.getByName('release')
          PLUGIN_FILE="node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle"
          if [ -f "$PLUGIN_FILE" ]; then
            sed -i 's/components\.release/components.getByName("release")/g' "$PLUGIN_FILE"
            echo "Patched ExpoModulesCorePlugin.gradle for AGP 8"
          fi
          # Fix expo-web-browser and other expo packages that reference expo-module-gradle-plugin
          # by ensuring the plugin classpath is available
          find node_modules -name "build.gradle" -path "*/expo-*/android/*" | while read f; do
            if grep -q "expo-module-gradle-plugin" "$f" 2>/dev/null; then
              echo "Found expo-module-gradle-plugin reference in: $f"
            fi
          done

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
