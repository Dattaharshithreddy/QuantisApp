name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TYPESCRIPT_SETUP: 1

      - name: Patch AGP 8 compatibility
        run: |
          find node_modules -name "*.gradle" -exec grep -l "from components\.release" {} \; | while read f; do
            sed -i 's/from components\.release/def __rc = components.findByName("release"); if (__rc != null) { from __rc }/g' "$f"
            echo "Patched: $f"
          done
          echo "AGP 8 patch complete"

      - name: Build Release APK
        id: gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon 2>&1 | tee /tmp/gradle_output.txt
          exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Show build errors
        if: steps.gradle.outcome == 'failure'
        run: |
          echo "=== GRADLE ERRORS ==="
          grep -A 10 "What went wrong\|FAILURE\|error:" /tmp/gradle_output.txt | head -80

      - name: Fail build
        if: steps.gradle.outcome == 'failure'
        run: exit 1

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
